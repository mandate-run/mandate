[package]
name = "mandate"
version = "0.1.0"
description = "Buyer runtime: purchases evidence under a mandate and accounts for every payment"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mandate"
path = "src/main.rs"

[features]
# Fixtures for tests in this crate, its integration tests and the harness.
# Off by default, so a release binary carries no throwaway key or fake
# market: the module says it is not part of the runtime's behavior, and
# this is what makes that true of the shipped artifact.
testing = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hedera.workspace = true
hedera-proto.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
prost.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
mandate = { path = ".", features = ["testing"] }
