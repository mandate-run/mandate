[package]
name = "proctor"
version = "0.1.0"
description = "Harness that builds and checks Hedera services against executable task contracts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "proctor"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
clap.workspace = true
mandate = { path = "../crates/mandate" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
mandate = { path = "../crates/mandate", features = ["testing"] }
