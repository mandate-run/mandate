[package]
name = "proctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Proctor: build Hedera services from an acceptance contract and test them under payment failure"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
mandate-core = { path = "../mandate-core" }
