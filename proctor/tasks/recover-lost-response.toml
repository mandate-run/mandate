# Recovery contract (docs/harness.md, initial scenarios): a purchase settles
# on chain, the seller drops the response, and the buyer recovers the result
# with the original signed payment — one transaction, one settlement.
#
# Requires a live configuration in the environment (see .env.example):
# GRAPH_API_KEY, MANDATE_ACCOUNT_ID, MANDATE_PRIVATE_KEY.

[task]
name = "recover a paid request after a lost response"
attempts = 3

[hooks]
setup = "cd sellers && npm install --no-fund --no-audit && cargo build -q -p mandate-cli"

[agent]
adapter = "adapters/claude-code"

[[check]]
name = "live recovery with a lost response"
run = """GRAPH_API_KEY=$GRAPH_API_KEY SELLER_FAULTS=drop-response-after-settle npm --prefix sellers start > /tmp/proctor-sellers.log 2>&1 &
SELLER_PID=$!
trap 'kill $SELLER_PID 2>/dev/null || true' EXIT
for i in $(seq 1 30); do curl -sf http://localhost:4021/healthz >/dev/null 2>&1 && break; sleep 0.5; done
cargo run -q -p mandate-cli -- run \
  --mandate-path mandate-demo/mandate.json \
  --manifest-path mandate-demo/manifest.json \
  --ledger-path mandate-demo/ledger.json \
  --transcript-path mandate-demo/transcript.json \
  --scenario normal --live --sellers-url http://localhost:4021 --json"""

# With the drop-response fault, every purchase is sent once, settles on chain,
# and is recovered by a retrieval with the same signed payment: one tx id, one
# settlement, never a second authorization, nothing left unresolved. The
# screen purchase is steps[0].
[check.expect]
"steps[0].submissions" = 1
"steps[0].retrievals" = 1
"totals.unresolved" = "0.0000"
