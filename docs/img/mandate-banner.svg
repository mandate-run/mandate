<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mandate: give your agent a mandate, not a credit card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7040ff"/>
      <stop offset="50%" stop-color="#4d7cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- ledger grid, faint -->
  <g stroke="#7c8db5" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 75h1200M0 150h1200M0 225h1200"/>
    <path d="M150 0v300M300 0v300M450 0v300M600 0v300M750 0v300M900 0v300M1050 0v300"/>
  </g>

  <!-- the decision: three quotes, one chosen -->
  <g transform="translate(820 96)">
    <g fill="none" stroke-width="2">
      <rect x="0" y="0" width="250" height="30" rx="6" stroke="#4d7cff" stroke-opacity="0.55"/>
      <rect x="0" y="39" width="250" height="30" rx="6" stroke="#7c8db5" stroke-opacity="0.28"/>
      <rect x="0" y="78" width="250" height="30" rx="6" stroke="#7c8db5" stroke-opacity="0.28"/>
    </g>
    <circle cx="-16" cy="15" r="4" fill="#22d3ee"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
      <text x="14" y="20" fill="#cfe0ff">staged   0.0033</text>
      <text x="14" y="59" fill="#7c8db5">hybrid   0.0042</text>
      <text x="14" y="98" fill="#7c8db5">bundle   0.0080</text>
      <text x="196" y="20" fill="#22d3ee">chosen</text>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(90 118)">
    <rect x="0" y="-34" width="5" height="86" rx="2.5" fill="url(#accent)"/>
    <text x="26" y="14" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif"
          font-size="68" font-weight="700" letter-spacing="-1.5" fill="#f2f6ff">Mandate</text>
    <text x="29" y="52" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif"
          font-size="19" fill="#93a7cc">Give your agent a mandate, not a credit card.</text>
  </g>

  <!-- footer rule and tags -->
  <rect x="90" y="212" width="420" height="2" rx="1" fill="url(#fade)"/>
  <g transform="translate(90 246)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7c8db5">
    <text x="0" y="0">x402</text>
    <text x="70" y="0">·</text>
    <text x="94" y="0">Hedera</text>
    <text x="180" y="0">·</text>
    <text x="204" y="0">The Graph</text>
    <text x="310" y="0">·</text>
    <text x="334" y="0">Rust</text>
  </g>
</svg>
