[package]
name = "mandate-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
libsql = { version = "0.10.0-pre.4", features = ["core", "sync"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Live transports (x402 quoting, Hedera exact signing, mirror observation, HCS)
r402-hedera = { version = "0.21", features = ["client"] }
hedera = "0.43"
reqwest = { version = "0.13", features = ["blocking", "json"] }
base64 = "0.23"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
